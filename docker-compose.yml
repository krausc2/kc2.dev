services:
  webserver:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT}:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}